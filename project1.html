<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savana - Fashion & Style</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Poppins',sans-serif;
    background:#f4f4f4;
    color:#333;
}


.header{
    background:white;
    position:fixed;
    width:100%;
    top:0;
    z-index:10;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.nav-container{
    max-width:1200px;
    margin:auto;
    padding:1rem 2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo{
    font-size:2.5rem;
    font-weight:bold;
    color:#e91e63;
}
.nav-menu{
    list-style:none;
    display:flex;
    gap:2rem;
}
.nav-menu a{
    text-decoration:none;
    color:#333;
    font-weight:500;
}
.nav-menu a:hover{
    color:#e91e63;
}


.hero{
    background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
    url("https://t4.ftcdn.net/jpg/04/72/44/67/360_F_472446747_AmtV7OdEJVyzVRFsVTjVHhIiFV00bMNr.jpg") center/cover no-repeat;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding-top:90px;
    color:white;
}
.hero-content{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(1px);
    padding:3rem 4rem;
    border-radius:25px;
}
.hero h1{
    font-size:4rem;
}
.hero p{
    font-size:1.5rem;
    margin:1rem 0 2rem;
}
.cta-btn{
    background:#e12866;
    color:white;
    padding:1rem 3rem;
    border-radius:50px;
    text-decoration:none;
    font-weight:600;
}


.section{
    max-width:1200px;
    margin:4rem auto;
    padding:0 2rem;
}
.section h2{
    text-align:center;
    font-size:2.8rem;
    color:#e91e63;
    margin-bottom:2.5rem;
}


.collections-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:2rem;
}
.collection-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}
.collection-card img{
    width:100%;
    height:350px;
    object-fit:cover;
}
.collection-card h3{
    text-align:center;
    padding:1rem;
    color:#e91e63;
}


.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:2rem;
}
.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}
.product-card:hover{
    transform:translateY(-8px);
}
.product-card img{
    width:100%;
    height:280px;
    object-fit:cover;
}
.product-info{
    padding:1.5rem;
}
.price{
    color:#e91e63;
    font-size:1.4rem;
    font-weight:bold;
}


.newsletter{
    background:#e91e63;
    color:white;
    text-align:center;
    padding:3rem 2rem;
    border-radius:15px;
}
.newsletter input{
    padding:1rem;
    width:280px;
    max-width:80%;
    border:none;
    border-radius:50px 0 0 50px;
}
.newsletter button{
    padding:1rem 1.7rem;
    border:none;
    border-radius:0 50px 50px 0;
    background:white;
    color:#e91e63;
    font-weight:600;
}


.footer{
    background:#222;
    color:white;
    text-align:center;
    padding:2.5rem;
    margin-top:3rem;
}
.footer a{
    color:white;
    margin:0 0.7rem;
    font-size:1.4rem;
    text-decoration:none;
}
.footer a:hover{
    color:#e91e63;
}


@media(max-width:768px){
    .hero h1{font-size:2.5rem;}
    .nav-menu{display:none;}
    .hero-content{padding:2rem;}
}
</style>
</head>

<body>


<header class="header">
    <nav class="nav-container">
        <div class="logo">Savana</div>
        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#collections">Collections</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#newsletter">Subscribe</a></li>
        </ul>
    </nav>
</header>


<section class="hero">
    <div class="hero-content">
        <h1>Discover Your Style</h1>
        <p>Trendy • Elegant • Confident</p>
        <a href="#collections" class="cta-btn">Shop Now</a>
    </div>
</section>


<section class="section" id="collections">
    <h2>Our Collections</h2>
    <div class="collections-grid">
        <div class="collection-card">
            <img src="https://img.florashe.com/2021/07/Fashion-Wine-Red-Sparkly-Evening-Party-Dress-Elegant-Ball-Gown01.jpg" alt="">
            <h3>Evening Wear</h3>
        </div>
        <div class="collection-card">
            <img src="https://i.pinimg.com/originals/39/c9/38/39c9388b0f91b63948892da56fb8b99d.jpg" alt="">
            <h3>Casual Chic</h3>
        </div>
        <div class="collection-card">
            <img src="https://i.pinimg.com/originals/30/43/54/30435428567beff1f2d2d5130e5e5c21.jpg" alt="">
            <h3>Winter Fashion</h3>
        </div>
    </div>
</section>


<section class="section" id="products">
    <h2>Featured Products</h2>
    <div class="products-grid">
        <div class="product-card">
            <img src="http://www.ryapparelco.com/cdn/shop/products/3_82b1267a-6fb7-4ad1-9eb8-cf1ddda12de4.jpg?v=1701254418">
            <div class="product-info">
                <p class="price">&#8377; 3,499</p>
            </div>
        </div>
        <div class="product-card">
            <img src="https://i.pinimg.com/originals/84/28/3b/84283b12ac116155239b48676cb6589e.jpg">
            <div class="product-info">
                <p class="price">&#8377;4,799</p>
            </div>
        </div>
        <div class="product-card">
            <img src="https://img101.savana.com/goods-pic/896f8ffbbbec42078092a1b16a820fc9_w540_h720_q85.webp">
            <div class="product-info">
                <p class="price">&#8377;5,299</p>
            </div>
        </div>
        <div class="product-card">
            <img src="https://i5.walmartimages.com/seo/ICHUANYI-Women-Wide-Leg-Jeans-High-Waist-Baggy-Jeans-for-Women-Loose-Boyfriends-Jeans-Denim-Pants_a81f5466-7e6c-48f8-8f4f-813c57dc5001.8795e4f1613f965992e0693ffbf391a2.jpeg">
            <div class="product-info">
                <p class="price">&#8377;2,999</p>
            </div>
        </div>
    </div>
</section>

<section class="newsletter" id="newsletter">
    <h2>Subscribe for Updates</h2>
    <p>Get latest fashion offers & news</p>
</section>
</body>
</html>
